input {
  jdbc {
    jdbc_driver_library => "${JDBC_DRIVER_PATH}"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "${JDBC_CONNECTION_STRING}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    jdbc_paging_enabled => true
    use_column_value => true
    tracking_column => "last_updated_at"
    tracking_column_type => "timestamp"
    schedule => "*/5 * * * * *"
    clean_run => false
    connection_retry_attempts => 3
    connection_retry_attempts_wait_time => 5
    statement => "
      SELECT
        id,
        lid,
	law,
       	no,
	order_num,
        content,
        created_at,
        updated_at,
        created_by,
        updated_by,
        updated_at AS last_updated_at
      FROM sections
      WHERE updated_at > :sql_last_value AND updated_at < NOW()
      ORDER BY updated_at ASC"
}

}

filter {
  mutate {
    copy => { "id" => "[@metadata][_id]" }
    remove_field => ["@version", "@timestamp","last_updated_at"]
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    index => "sections"
    document_id => "%{[@metadata][_id]}"
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"

    ssl_enabled => true
    ssl_certificate_authorities => "${ES_CA_CERT_PATH}"

    action => "update"
    doc_as_upsert => true

  }
}
